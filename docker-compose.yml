services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sap_middleware}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - sap_middleware_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sap_middleware}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SAP_MOCK_MODE: ${SAP_MOCK_MODE:-true}
      SAP_ASHOST: ${SAP_ASHOST:-}
      SAP_SYSNR: ${SAP_SYSNR:-00}
      SAP_CLIENT: ${SAP_CLIENT:-100}
      SAP_USER: ${SAP_USER:-}
      SAP_PASSWD: ${SAP_PASSWD:-}
      SAP_LANG: ${SAP_LANG:-EN}
      API_KEY: ${API_KEY:-change-me}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sap_middleware_pgdata:
